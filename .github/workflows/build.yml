
name: Build JH NEXUS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - 'app/**'
      - 'gradle.properties'
      - 'JH-NEXUS-APK.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "JH-NEXUS-APK.zip" ]; then
            mkdir -p projeto
            unzip -o JH-NEXUS-APK.zip -d projeto
          fi

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=""

          for ROOT in "." "projeto"; do
            if [ -f "$ROOT/settings.gradle.kts" ]; then
              SETTINGS_FILE="$ROOT/settings.gradle.kts"
              break
            elif [ -f "$ROOT/settings.gradle" ]; then
              SETTINGS_FILE="$ROOT/settings.gradle"
              break
            fi
          done

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find . \
              -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path './.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Nenhum settings.gradle ou settings.gradle.kts foi encontrado. Verifique o ZIP e a estrutura do projeto Android."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::O projeto foi encontrado, mas não existe app/build.gradle ou app/build.gradle.kts."
            echo "Diretório encontrado: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Android encontrado em: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Locate generated APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -path '*/intermediates/*' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::A compilação terminou, mas nenhum APK debug foi encontrado."
            find "$PROJECT_DIR" -type d -path '*/build/outputs/*' -print
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK gerado: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JH-NEXUS-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JH-NEXUS-build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
